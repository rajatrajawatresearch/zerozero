# ZeroZero Alembic configuration.
#
# The SQLAlchemy URL is intentionally left blank here — `alembic/env.py`
# populates it at runtime from `zerozero_api.settings.get_settings()` using
# the synchronous driver URL (`DATABASE_URL_SYNC`). This keeps credentials
# out of version control and guarantees a single source of truth.

[alembic]
# Path to migration scripts (relative to this file).
script_location = alembic

# Timezone for timestamps in generated migration filenames.
timezone = UTC

# Filename template for new revision files (autogenerated).
# Produces names like: 20260420_2332_ab12cd34ef56_add_users.py
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# Paths prepended to sys.path so `zerozero_api` is importable from env.py.
prepend_sys_path = . src

# SQLAlchemy URL — left empty on purpose. Set dynamically in env.py.
sqlalchemy.url =


# ----------------------------------------------------------------------------
# Logging configuration
# ----------------------------------------------------------------------------

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
